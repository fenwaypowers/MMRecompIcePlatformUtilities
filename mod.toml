# Config file for an example Majora's Mask: Recompiled mod.

# Fields that end up in the mod's manifest.
[manifest]

# Unique ID of this mod. Pick something long enough that it'll never be the same as any other mod.
# The name displayed in the mod management menu is separate from this so this doesn't need to be human readable.
id = "mm_recomp_ice_platform_utilities"

# Version of this mod.
version = "1.2.0"

# The name that will show up for this mod in the mod menu. This should be human readable.
display_name = "Ice Platform Utilities"

# The description that will show up when this mod is displayed in the mod menu. This should be human readable.
description = """
Allows ice platforms anywhere, allows up to five ice platforms to exist concurrently, and lets you adjust their lifetime.

Features:
- Allow ice platforms anywhere in the game
  (on by default, can be turned off)

- Change how many ice platforms can exist concurrently
  (default = 3, which is the vanilla value)

- Set how long ice platforms last before melting
  (default = 15 seconds, which is the vanilla value)

- Specify which areas allow ice platform creation in the config
"""

# A short description that will show up in this mod's entry in the mod list. This should be human readable and kept short
# to prevent it from being cut off due to the limited space.
short_description = "Allows ice platforms anywhere, allows up to five ice platforms to exist concurrently, and lets you adjust their lifetime."

# Authors of this mod.
authors = [ "Fenway Powers" ]

# ID of the target recomp game.
game_id = "mm"

# Minimum version of the target recomp (e.g. Zelda 64: Recompiled) that this mod can run on.
minimum_recomp_version = "0.1.0"

# Dependency mods. Each entry is the mod's ID and then an optional minimum version of the dependency mod.
dependencies = [
    "yazmt_mm_global_objects",
]

# Optional dependency mods. This has the same format as `dependencies`, but the game will still start if dependencies in this
# list aren't present. You can query the presence of a given dependency by using `recomp_is_dependency_met` in recomputils.h.
# Calling a function imported from an optional dependency that isn't present will trigger an error.
optional_dependencies = [

]

# Native libraries (e.g. DLLs) and the functions they export.
native_libraries = [
# Example native library:
#    { name = "my_native_library", funcs = ["my_native_library_function"] }
]

# Inputs to the mod tool.
[inputs]

# Input elf file to generate a mod from.
elf_path = "build/mod.elf"

# Output mod filename.
mod_filename = "mm_recomp_ice_platform_utilities"

# Reference symbol files.
func_reference_syms_file = "Zelda64RecompSyms/mm.us.rev1.syms.toml"
data_reference_syms_files = [ "Zelda64RecompSyms/mm.us.rev1.datasyms.toml", "Zelda64RecompSyms/mm.us.rev1.datasyms_static.toml" ]

# Additional files to include in the mod.
additional_files = ["thumb.png"]

[[manifest.config_options]]
id = "allow_anywhere"
name = "Allow Ice Platforms Anywhere"
description = "Determines if ice platforms can be created on any body of water. If set to Yes, then the settings for specific scenes will be disregarded and all bodies of water in the game will allow ice platform creation. If set to No, then ice platforms will only be spawnable where they would be in the vanilla game, as well as in any of the scenes you specify should allow ice platform creation."
type = "Enum"
options = [ "Yes", "No" ]
default = "Yes"

[[manifest.config_options]]
id = "max_instances"
name = "Number of Concurrent Ice Platforms Allowed"
description = "Set how many ice platforms can exist concurrently. The vanilla value is 3. Setting this to 0 will prevent ice platforms from spawning ever."
type = "Number"
min = 0
max = 5
step = 1
precision = 1
percent = false
default = 3

[[manifest.config_options]]
id = "icefloe_lifetime"
name = "Ice Platform Lifetime"
description = "Set how long in seconds each ice platform should exist before melting. The vanilla value is 15. Setting this to 0 will make it so ice platforms only exist long enough to spawn and then instantly melt."
type = "Number"
min = 0
max = 60
step = 1
precision = 1
percent = false
default = 15

